# Deploy Docker (repo privat) — runner ARC arc-docker: build & push image ke GHCR, lalu deploy lewat SSH.
# Hanya staging dan main. Secret diambil dari GitHub Environment "staging" / "production":
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY (kunci privat deploy), GHCR_USER, GHCR_TOKEN (read:packages, untuk pull di VPS)
# Variabel environment: DEPLOY_PATH (folder docker-compose di VPS), SERVICE (nama service di compose).
name: Deploy

on:
  push:
    branches: [staging, main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # deploy tidak boleh dibatalkan di tengah jalan

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}

jobs:
  build:
    runs-on: arc-docker
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # SESUAIKAN: file Dockerfile produksi bila bukan ./Dockerfile
          file: ./Dockerfile
          push: true
          # Tanpa cache GitHub (type=gha): unggahan dari jaringan kantor lambat.
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: arc-docker
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Siapkan kunci SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ vars.SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" SERVICE="$SERVICE" GHCR_USER="$GHCR_USER" 'bash -s' <<<"
            set -euo pipefail
            echo '$GHCR_TOKEN' | docker login ghcr.io -u \"\$GHCR_USER\" --password-stdin >/dev/null
            cd \"\$DEPLOY_PATH\"
            docker compose pull \"\$SERVICE\"
            docker compose up -d \"\$SERVICE\"
            docker image prune -f >/dev/null
          "
          # SESUAIKAN: tambahkan migrasi/cek kesehatan setelah up -d bila perlu.

      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
