# CI Laravel (repo privat) — runner ARC arc-ci, kontainer ci-php, MySQL sebagai service.
name: CI

on:
  push:
    branches: [dev, staging, main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [dev, staging, main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: arc-ci
    timeout-minutes: 30
    container:
      # SESUAIKAN: versi PHP = "require.php" di composer.json dan Dockerfile produksi (8.2 / 8.3 / 8.4).
      image: ghcr.io/webekspres/ci-php:8.4
    services:
      mysql:
        image: mysql:8.4   # SESUAIKAN: samakan dengan versi MySQL produksi
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql        # nama service, bukan 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: Webekspres/.github/actions/tunggu-db@main
        with:
          type: mysql
          password: root

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Siapkan .env
        run: |
          [ -f .env ] || cp .env.example .env
          php artisan key:generate --force

      - name: Pint
        run: vendor/bin/pint --test

      - name: Test
        # SESUAIKAN: ganti dengan vendor/bin/pest bila repo memakai Pest.
        run: php artisan test
