# Reusable: deploy ke VPS lewat SSH di runner ARC arc-docker.
#
#   deploy-staging:
#     needs: build
#     if: github.ref_name == 'staging'
#     uses: Webekspres/.github/.github/workflows/deploy-ssh.yml@v1
#     with:
#       environment: staging
#       image-tag: ${{ needs.build.outputs.tag }}
#       script: |
#         cd /opt/app-staging
#         docker compose pull app && docker compose up -d app
#       secret-prefix: STAGING_          # membaca STAGING_VPS_HOST, STAGING_VPS_PORT, STAGING_VPS_USER, STAGING_VPS_SSH_KEY
#     secrets: inherit
#
# Secret dibaca dengan NAMA (bukan nilai) supaya secret level repo maupun level GitHub Environment
# sama-sama terbaca: secret environment hanya tersedia di job yang memakai environment tersebut.
# Nama bawaan: <prefix>VPS_HOST, <prefix>VPS_PORT (opsional, bawaan 22), <prefix>VPS_USER, <prefix>VPS_SSH_KEY.
# Repo dengan nama lain mengisi host-secret / port-secret / user-secret / key-secret.
#
# `script` dijalankan di VPS dengan bash (set -euo pipefail). Variabel yang tersedia:
#   IMAGE_TAG    tag tetap hasil build (input image-tag), mis. sha-<commit>
#   ENVIRONMENT  staging | production
#   GIT_SHA      commit yang dideploy
#   + setiap nama di input `script-secrets` (nilai secret dengan nama yang sama)
# Sebelum script, VPS login ke GHCR (token job, hanya baca package) dan logout setelahnya.
# Opsional: `upload-dir` disalin ke `upload-to` di VPS sebelum script (mis. compose + skrip deploy),
# `health-url` dicek setelah script.
name: deploy-ssh

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production (GitHub Environment; aturan proteksi & secret environment berlaku)
        type: string
        required: true
      script:
        description: Perintah yang dijalankan di VPS.
        type: string
        required: true
      image-tag:
        type: string
        default: ''
      url:
        description: URL aplikasi, tampil di halaman deployment GitHub.
        type: string
        default: ''
      script-secrets:
        description: >-
          Nama secret (dipisah spasi/baris) yang diekspor sebagai variabel env bernama sama ke script di VPS,
          mis. "VPS_DEPLOY_PATH". Nilainya tidak tampil di log.
        type: string
        default: ''
      github-environment:
        description: >-
          Nama GitHub Environment untuk job ini. Kosong = sama dengan `environment`;
          "none" = tanpa environment (hanya secret level repo, tanpa aturan proteksi environment).
        type: string
        default: ''
      upload-dir:
        description: Folder di repo yang disalin ke VPS sebelum script.
        type: string
        default: ''
      upload-to:
        description: Folder tujuan di VPS untuk upload-dir.
        type: string
        default: ''
      fingerprint:
        description: Sidik jari host key VPS (SHA256:...). Kosong = percaya host key pertama (ssh-keyscan).
        type: string
        default: ''
      health-url:
        description: URL yang harus merespons 2xx setelah deploy, satu per baris (dicek dari runner, dicoba ulang ±1 menit).
        type: string
        default: ''
      ghcr-login:
        description: Login GHCR di VPS sebelum script.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30
      secret-prefix:
        description: Awalan nama secret SSH, mis. STAGING_ atau PRODUCTION_.
        type: string
        default: ''
      host-secret:
        type: string
        default: VPS_HOST
      port-secret:
        type: string
        default: VPS_PORT
      user-secret:
        type: string
        default: VPS_USER
      key-secret:
        description: Kunci privat SSH (PEM/OpenSSH, boleh base64).
        type: string
        default: VPS_SSH_KEY
      runs-on:
        description: >-
          Label runner (JSON). Bawaan runner ringan non-ARC (spark): job deploy hanya SSH, tidak perlu
          menempati slot arc-docker yang dipakai build.
        type: string
        default: '["self-hosted", "light"]'
      registry-token-secret:
        description: Nama secret token baca GHCR untuk VPS. Kosong = token job (GITHUB_TOKEN).
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.github-environment != 'none' && (inputs.github-environment || inputs.environment) || '' }}
      url: ${{ inputs.github-environment != 'none' && inputs.url || '' }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets[format('{0}{1}', inputs.secret-prefix, inputs.host-secret)] }}
      SSH_PORT: ${{ secrets[format('{0}{1}', inputs.secret-prefix, inputs.port-secret)] }}
      SSH_USER: ${{ secrets[format('{0}{1}', inputs.secret-prefix, inputs.user-secret)] }}
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets[format('{0}{1}', inputs.secret-prefix, inputs.key-secret)] }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          host=$(printf '%s' "$SSH_HOST" | tr -d ' \r\n'); port=$(printf '%s' "${SSH_PORT:-22}" | tr -d ' \r\n')
          user=$(printf '%s' "$SSH_USER" | tr -d ' \r\n')
          [ -n "$host" ] && [ -n "$user" ] || { echo "::error::secret ${{ inputs.secret-prefix }}${{ inputs.host-secret }} / ${{ inputs.secret-prefix }}${{ inputs.user-secret }} kosong (environment ${{ inputs.environment }})"; exit 1; }
          # Kunci & known_hosts di RUNNER_TEMP, bukan ~/.ssh: runner bisa permanen (spark), dihapus di akhir job.
          d="$RUNNER_TEMP/ssh"; install -m 700 -d "$d"
          # Tanpa `printf | grep -q`: dengan pipefail, grep -q yang berhenti lebih awal membuat printf kena
          # SIGPIPE sehingga kunci PEM dianggap base64.
          case "$SSH_KEY" in
            *-----BEGIN*) printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$d/deploy_key" ;;
            *) printf '%s' "$SSH_KEY" | tr -d '\r\n ' | base64 -d > "$d/deploy_key" \
                 || { echo "::error::secret ${{ inputs.secret-prefix }}${{ inputs.key-secret }} bukan kunci PEM/OpenSSH maupun base64"; exit 1; } ;;
          esac
          chmod 600 "$d/deploy_key"
          ssh-keygen -y -f "$d/deploy_key" >/dev/null || { echo "::error::secret key bukan kunci privat SSH yang valid"; exit 1; }
          for i in 1 2 3; do
            ssh-keyscan -T 15 -p "$port" -H "$host" > "$d/known_hosts" 2> "$RUNNER_TEMP/keyscan.err" || true
            [ -s "$d/known_hosts" ] && break
            sleep 5
          done
          if [ ! -s "$d/known_hosts" ]; then
            # Nilai secret otomatis disamarkan (***) oleh GitHub di log.
            sed 's/^/  ssh-keyscan: /' "$RUNNER_TEMP/keyscan.err"
            echo "::error::tidak bisa membaca host key VPS ($host port $port); cek secret host/port dan firewall"
            exit 1
          fi
          if [ -n "$FINGERPRINT" ]; then
            ssh-keygen -lf "$d/known_hosts" | grep -F "$FINGERPRINT" >/dev/null \
              || { echo "::error::host key VPS tidak cocok dengan fingerprint $FINGERPRINT"; exit 1; }
          fi
          { echo "SSH_HOST=$host"; echo "SSH_PORT=$port"; echo "SSH_USER=$user"
            echo "SSH_OPTS=-i $d/deploy_key -o UserKnownHostsFile=$d/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        if: inputs.upload-dir != ''

      - name: Salin ${{ inputs.upload-dir }} ke VPS
        if: inputs.upload-dir != ''
        env:
          SRC: ${{ inputs.upload-dir }}
          DEST: ${{ inputs.upload-to }}
        run: |
          [ -n "$DEST" ] || { echo "::error::upload-to wajib diisi bila upload-dir dipakai"; exit 1; }
          tar -C "$SRC" -cf - . | ssh $SSH_OPTS -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEST' && tar -C '$DEST' -xf -"

      - name: Jalankan deploy di VPS
        env:
          SCRIPT: ${{ inputs.script }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          GHCR_LOGIN: ${{ inputs.ghcr-login }}
          GHCR_TOKEN: ${{ inputs.registry-token-secret != '' && secrets[inputs.registry-token-secret] || secrets.GITHUB_TOKEN }}
          SCRIPT_SECRET_NAMES: ${{ inputs.script-secrets }}
          ALL_SECRETS: ${{ inputs.script-secrets != '' && toJSON(secrets) || '{}' }}
        run: |
          # Rakit script lengkap dulu (gagal di sini = tidak ada yang dijalankan di VPS), lalu kirim lewat stdin.
          script_file=$(mktemp "$RUNNER_TEMP/deploy.XXXXXX"); trap 'rm -f "$script_file"' EXIT
          {
            echo 'set -euo pipefail'
            printf 'export IMAGE_TAG=%q ENVIRONMENT=%q GIT_SHA=%q\n' "$IMAGE_TAG" "$ENVIRONMENT" "$GITHUB_SHA"
            for name in $SCRIPT_SECRET_NAMES; do
              value=$(printf '%s' "$ALL_SECRETS" | jq -r --arg n "$name" '.[$n] // empty')
              [ -n "$value" ] || { echo "::error::secret $name kosong/tidak ada" >&2; exit 1; }
              printf 'export %s=%q\n' "$name" "$value"
            done
            if [ "$GHCR_LOGIN" = true ]; then
              printf 'printf %%s %q | docker login ghcr.io -u %q --password-stdin >/dev/null\n' "$GHCR_TOKEN" "$GITHUB_ACTOR"
              echo "trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT"
            fi
            printf '%s\n' "$SCRIPT"
          } > "$script_file"
          ssh $SSH_OPTS -o ServerAliveInterval=30 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' < "$script_file"

      - name: Cek kesehatan
        if: inputs.health-url != ''
        env:
          URLS: ${{ inputs.health-url }}
        run: |
          for url in $URLS; do
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 10 "$url" || true)
              case "$code" in 2*) echo "OK $code $url"; continue 2 ;; esac
              [ "$i" -eq 12 ] && { echo "::error::$url merespons $code setelah deploy"; exit 1; }
              sleep 5
            done
          done

      - name: Hapus kunci SSH
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
