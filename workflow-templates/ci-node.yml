# CI Node/TypeScript (repo privat) — runner ARC arc-ci, kontainer ci-node.
# Package manager dipilih dari lockfile: bun.lock/bun.lockb -> bun, selain itu npm.
name: CI

on:
  push:
    branches: [dev, staging, main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [dev, staging, main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: arc-ci
    timeout-minutes: 30
    container:
      # SESUAIKAN: versi Node = .nvmrc / "engines.node" / Dockerfile produksi (20 / 22).
      image: ghcr.io/webekspres/ci-node:22
    steps:
      - uses: actions/checkout@v4

      - name: Install dependensi
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then echo "PM=bun" >> "$GITHUB_ENV"; bun install --frozen-lockfile
          else echo "PM=npm" >> "$GITHUB_ENV"; npm ci; fi

      - name: Lint, typecheck, test
        # Script yang tidak ada di package.json dilewati. SESUAIKAN nama script bila berbeda.
        run: |
          for s in lint typecheck test; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              echo "::group::$PM run $s"; $PM run "$s"; echo "::endgroup::"
            else
              echo "script '$s' tidak ada, dilewati"
            fi
          done
